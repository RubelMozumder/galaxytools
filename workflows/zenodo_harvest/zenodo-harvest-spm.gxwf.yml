class: GalaxyWorkflow
label: Zenodo harvest for SPM data
doc: |
  Downloads the files of a work list from Zenodo, reads each raw SPM file's header, finds its
  technique, builds its ELN (optionally with an LLM through LLM Hub), converts the raw files to
  NeXus with pynxtools-spm and builds the results, NOMAD project zips and logs for the
  zenodo_harvest Action of nomad-eosc-galaxy-actions.
license: MIT
creator:
  - class: Person
    name: Rubel Mozumder
    url: https://github.com/RubelMozumder
  - class: Organization
    name: FAIRmat
    url: https://www.fairmat-nfdi.eu/fairmat/
# The NOMAD side uploads the work list to step 0, sets steps 2 and 3, and reads the outputs by
# these labels (activities.py: GALAXY_*_STEP; workflows.py: GALAXY_*_OUTPUT).
inputs:
  work list:
    type: data
    format: json
    doc: work_list.json from the NOMAD side.
  prefetched files:
    type: collection
    collection_type: list
    optional: true
    doc: Optional. Files already in Galaxy, with the Zenodo file key as element identifier.
  # New inputs go after the existing ones, so the step numbers above stay.
  use llm:
    type: boolean
    default: true
    doc: Let an LLM (LLM Hub) find the technique and fill the ELN fields the rules leave empty. On by default; needs "llm model".
  llm model:
    type: text
    default: mistral-medium-3.5-e-infra.cz
    doc: >-
      LLM Hub multimodal model: a value of the server's genai_models table with type "multimodal".
      The default is a model on usegalaxy.eu.
  eln rules:
    type: data
    format: yaml
    optional: true
    doc: Optional. ELN rules to use instead of pynxtools-spm's eln_rules.yaml, e.g. a fix to test.
  eln instructions:
    type: data
    format: txt
    optional: true
    doc: Optional. ELN instructions to use instead of pynxtools-spm's eln_instructions.md.
outputs:
  manifest:
    outputSource: download/manifest
  # Outputs of the middle steps, so the run's Outputs tab lists every file by name.
  eln rules used:
    outputSource: eln_files/rules
  eln instructions used:
    outputSource: eln_files/instructions
  headers:
    outputSource: header/header
  detection answers:
    outputSource: detect/output
  # The ELN the converter reads: the rule ELN plus the LLM values that passed the checks.
  eln files:
    outputSource: merge/merged_eln
  eln reports:
    outputSource: eln/eln_report
  eln llm reports:
    outputSource: merge/eln_llm_report
  llm answers:
    outputSource: llm/output
  nexus files:
    outputSource: convert/output_nxs
  conversion statuses:
    outputSource: convert/status_json
  converter logs:
    outputSource: convert/converter_log
  results:
    outputSource: report/results
  projects:
    outputSource: report/projects
  logs:
    outputSource: report/logs
  summary:
    outputSource: report/summary
steps:
  download:
    doc: Download and safely unzip the work list's files; write the manifest.
    tool_id: zenodo_nomad_download
    tool_version: 0.2.0
    in:
      work_list: work list
      prefetched: prefetched files
    tool_state:
      # Keep equal to the converter's id and version: the NOMAD side retries failed files when it changes.
      pipeline_version: pynxtools_spm_converter 0.5.1+galaxy0
  eln_files:
    doc: The ELN rules and instructions of pynxtools-spm, or the given overrides; once per run.
    tool_id: pynxtools_spm_eln_files
    tool_version: 0.5.1+galaxy0
    in:
      rules_override: eln rules
      instructions_override: eln instructions
  header:
    doc: Read each raw file's header (metadata) as JSON with gwyddionpy.
    tool_id: spm_raw_header
    tool_version: 0.5.1+galaxy0
    in:
      raw: download/raw_files
  detect_input:
    doc: Write the input of the detection job per raw file (Detection instructions, header, record and context texts).
    tool_id: nexus_llm_input
    tool_version: 0.4.0
    # Bundles and headers have the same element identifiers as the raw files, so Galaxy pairs them.
    in:
      bundle: download/context_bundles
      header: header/header
      rules: eln_files/rules
      instructions: eln_files/instructions
    tool_state:
      stage_cond:
        stage: detect
  detect:
    doc: Ask the LLM for each raw file's technique and scan mode, with quotes. Skipped unless "use llm".
    tool_id: llm_hub
    tool_version: 2.53.0+galaxy0
    in:
      # A list of lists: Galaxy runs one job per inner list, i.e. per raw file.
      model_condition|text_context: detect_input/llm_context
      model_condition|model: llm model
      should_run: use llm
    when: $(inputs.should_run)
    tool_state:
      model_condition:
        # Fixed: Galaxy 25.0 cannot connect an input to this conditional's selector.
        model_type: multimodal
        # Unconnected optional input: an explicit value, else Galaxy's API refuses the invocation.
        image_context: null
        # Galaxy strips newlines and quotes from text fields: the rules are in eln_instructions.txt.
        prompt: Follow the instructions in the file eln_instructions.txt exactly. Use only the other context files as sources. Answer with the two YAML blocks only.
      advanced:
        temperature: 0.0
  eln:
    doc: >-
      Build an ELN per raw file. The technique comes from the detection answer if its quote is
      found, else from the header markers of the rules, else from the file extension.
    tool_id: nexus_eln_builder
    tool_version: 0.4.0
    # A skipped detect step gives "null" answers; the builder then ignores them.
    in:
      bundle: download/context_bundles
      header: header/header
      rules: eln_files/rules
      answer: detect/output
    tool_state:
      technique: auto
  llm_input:
    doc: Write the input of the ELN job per raw file (instructions, base ELN, header, record and context texts).
    tool_id: nexus_llm_input
    tool_version: 0.4.0
    in:
      bundle: download/context_bundles
      stage_cond|eln: eln/eln
      header: header/header
      rules: eln_files/rules
      instructions: eln_files/instructions
    tool_state:
      stage_cond:
        stage: eln
  llm:
    doc: Ask the LLM to fill the empty ELN fields; one job per raw file. Skipped unless "use llm".
    tool_id: llm_hub
    tool_version: 2.53.0+galaxy0
    in:
      model_condition|text_context: llm_input/llm_context
      model_condition|model: llm model
      should_run: use llm
    when: $(inputs.should_run)
    tool_state:
      model_condition:
        model_type: multimodal
        image_context: null
        prompt: Follow the instructions in the file eln_instructions.txt exactly. Use only the other context files as sources. Answer with the two YAML blocks only.
      advanced:
        temperature: 0.0
  merge:
    doc: Keep the LLM values that pass the checks and merge them into the rule ELN.
    tool_id: nexus_eln_llm_merge
    tool_version: 0.4.0
    # A skipped llm step gives "null" answers; the rule ELN is then kept.
    in:
      bundle: download/context_bundles
      eln: eln/eln
      answer: llm/output
      header: header/header
      rules: eln_files/rules
      instructions: eln_files/instructions
  convert:
    doc: Convert each raw file and its ELN to NeXus with pynxtools-spm.
    tool_id: pynxtools_spm_converter
    tool_version: 0.5.1+galaxy0
    # Raw files and ELNs have the same element identifiers, so Galaxy pairs them.
    in:
      raw_file: download/raw_files
      eln: merge/merged_eln
    # Unconnected optional inputs need an explicit value: Galaxy's API refuses to invoke a
    # workflow whose tool state it would have to correct.
    tool_state:
      config: null
      nxdl: auto
  report:
    doc: Build the results, one NOMAD project zip per record, logs and a summary.
    tool_id: nexus_report_builder
    tool_version: 0.2.0
    in:
      manifest: download/manifest
      statuses: convert/status_json
      nexus_files: convert/output_nxs
      elns: merge/merged_eln
      raw_files: download/raw_files
      context_files: download/context_files
      eln_reports: eln/eln_report
      converter_logs: convert/converter_log
